# Merge gates: unit tests plus a type-checked production build. Everything runs with no
# network access to Supabase (the nullable-client pattern in src/services/supabase.ts is
# what makes the suite hermetic).
name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
