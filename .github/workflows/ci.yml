# Merge gates: lint, unit tests, and a type-checked production build. Everything runs with no
# network access to Supabase (the nullable-client pattern in src/services/supabase.ts is
# what makes the suite hermetic).
name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      # Placeholder values so the bundle is the real one. Without them the unconfigured
      # branch constant-folds and the bundler shakes most of the app out of the build.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_placeholder
